<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisasi 3D: Sudut Antara Dua Batang Rangka</title>
    
    <!-- Memuat Plotly.js untuk grafik 3D -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    
    <!-- Memuat MathJax untuk render rumus matematika -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f7f6;
        }
        #plot-container {
            width: 65%;
            height: 100%;
            background-color: #ffffff;
        }
        #info-panel {
            width: 35%;
            padding: 30px;
            background: #ffffff;
            box-shadow: -2px 0 10px rgba(0,0,0,0.05);
            overflow-y: auto;
            border-left: 1px solid #e0e0e0;
        }
        h2 { color: #2c3e50; font-size: 1.5rem; margin-top: 0; margin-bottom: 15px;}
        p { color: #34495e; line-height: 1.6; margin: 5px 0;}
        
        .input-section {
            background: #eaf2f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #d4e6f1;
        }
        .input-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        .input-row label {
            font-weight: bold;
            width: 80px;
            color: #2980b9;
        }
        .input-row input {
            width: 60px;
            padding: 5px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
        .math-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            #plot-container, #info-panel { width: 100%; height: auto; min-height: 50vh; }
        }
    </style>
</head>
<body>

    <!-- Container untuk Grafik 3D -->
    <div id="plot-container"></div>

    <!-- Panel Informasi & Rumus -->
    <div id="info-panel">
        <h2>Interaktif: Sudut Rangka</h2>
        
        <div class="input-section">
            <div class="input-row">
                <label style="color: #2980b9;">Vektor u:</label>
                <input type="number" id="ux" value="2" oninput="updateAll()"> i +
                <input type="number" id="uy" value="2" oninput="updateAll()"> j +
                <input type="number" id="uz" value="1" oninput="updateAll()"> k
            </div>
            <div class="input-row" style="margin-bottom: 0;">
                <label style="color: #c0392b;">Vektor v:</label>
                <input type="number" id="vx" value="0" oninput="updateAll()"> i +
                <input type="number" id="vy" value="4" oninput="updateAll()"> j +
                <input type="number" id="vz" value="3" oninput="updateAll()"> k
            </div>
        </div>

        <div class="math-box">
            <strong>Vektor Batang:</strong>
            <div id="math-vektor"></div>
        </div>

        <div class="math-box">
            <strong>1. Dot Product:</strong>
            <div id="math-dot"></div>
        </div>

        <div class="math-box">
            <strong>2. Panjang Vektor:</strong>
            <div id="math-mag"></div>
        </div>

        <div class="math-box">
            <strong>3. Sudut Jepit (\( \theta \)):</strong>
            <div id="math-angle"></div>
        </div>
    </div>

    <script>
        // Konfigurasi dasar layout 3D
        const config = { responsive: true };
        
        function updateAll() {
            // 1. Ambil nilai dari input, gunakan 0 jika kosong
            const ux = parseFloat(document.getElementById('ux').value) || 0;
            const uy = parseFloat(document.getElementById('uy').value) || 0;
            const uz = parseFloat(document.getElementById('uz').value) || 0;
            
            const vx = parseFloat(document.getElementById('vx').value) || 0;
            const vy = parseFloat(document.getElementById('vy').value) || 0;
            const vz = parseFloat(document.getElementById('vz').value) || 0;

            // 2. Kalkulasi Matematis
            const dot = (ux * vx) + (uy * vy) + (uz * vz);
            const magU_sq = (ux*ux) + (uy*uy) + (uz*uz);
            const magV_sq = (vx*vx) + (vy*vy) + (vz*vz);
            const magU = Math.sqrt(magU_sq);
            const magV = Math.sqrt(magV_sq);
            
            let cosTheta = 0;
            let thetaDeg = 0;
            if (magU > 0 && magV > 0) {
                cosTheta = dot / (magU * magV);
                // Mencegah error presisi floating point saat arccos (misal cosTheta > 1)
                cosTheta = Math.max(-1, Math.min(1, cosTheta));
                thetaDeg = Math.acos(cosTheta) * (180 / Math.PI);
            }

            // 3. Update Teks Rumus (Siapkan string LaTeX)
            document.getElementById('math-vektor').innerHTML = 
                `\\( \\vec{u} = ${ux}\\mathbf{i} + ${uy}\\mathbf{j} + ${uz}\\mathbf{k} \\)<br>` +
                `\\( \\vec{v} = ${vx}\\mathbf{i} + ${vy}\\mathbf{j} + ${vz}\\mathbf{k} \\)`;

            document.getElementById('math-dot').innerHTML = 
                `\\( \\vec{u} \cdot \\vec{v} = (${ux})(${vx}) + (${uy})(${vy}) + (${uz})(${vz}) \\)<br>` +
                `\\( \\vec{u} \cdot \\vec{v} = ${ux*vx} + ${uy*vy} + ${uz*vz} = ${dot} \\)`;

            document.getElementById('math-mag').innerHTML = 
                `\\( |\\vec{u}| = \\sqrt{${ux}^2 + ${uy}^2 + ${uz}^2} = \\sqrt{${magU_sq}} \\approx ${magU.toFixed(2)} \\text{ m} \\)<br>` +
                `\\( |\\vec{v}| = \\sqrt{${vx}^2 + ${vy}^2 + ${vz}^2} = \\sqrt{${magV_sq}} \\approx ${magV.toFixed(2)} \\text{ m} \\)`;

            if (magU > 0 && magV > 0) {
                document.getElementById('math-angle').innerHTML = 
                    `\\( \\cos(\\theta) = \\frac{\\vec{u} \\cdot \\vec{v}}{|\\vec{u}| |\\vec{v}|} \\)<br>` +
                    `\\( \\cos(\\theta) = \\frac{${dot}}{\\sqrt{${magU_sq}} \\times \\sqrt{${magV_sq}}} \\approx ${cosTheta.toFixed(4)} \\)<br>` +
                    `\\( \\theta = \\arccos(${cosTheta.toFixed(4)}) \\approx \\mathbf{${thetaDeg.toFixed(2)}^\\circ} \\)`;
            } else {
                document.getElementById('math-angle').innerHTML = `<p style="color:red;">Panjang vektor tidak boleh 0</p>`;
            }

            // Memaksa MathJax untuk merender ulang rumus baru
            if (window.MathJax) {
                MathJax.typesetPromise();
            }

            // 4. Update Visualisasi 3D Plotly
            const traceU = {
                type: 'scatter3d', mode: 'lines+markers+text',
                x: [0, ux], y: [0, uy], z: [0, uz],
                line: { width: 8, color: '#3498db' },
                marker: { size: [0, 8], color: '#2980b9' },
                text: ['', `u (${ux}, ${uy}, ${uz})`],
                textposition: 'top right', name: 'Vektor u'
            };

            const traceV = {
                type: 'scatter3d', mode: 'lines+markers+text',
                x: [0, vx], y: [0, vy], z: [0, vz],
                line: { width: 8, color: '#e74c3c' },
                marker: { size: [0, 8], color: '#c0392b' },
                text: ['', `v (${vx}, ${vy}, ${vz})`],
                textposition: 'top left', name: 'Vektor v'
            };

            const traceOrigin = {
                type: 'scatter3d', mode: 'markers+text',
                x: [0], y: [0], z: [0],
                marker: { size: 10, color: '#2c3e50' },
                text: ['Joint (0,0,0)'],
                textposition: 'bottom center', name: 'Joint'
            };

            // Menyesuaikan rentang sumbu agar vektor selalu terlihat
            const maxVal = Math.max(Math.abs(ux), Math.abs(uy), Math.abs(uz), Math.abs(vx), Math.abs(vy), Math.abs(vz), 5);

            const layout = {
                title: 'Visualisasi Interaktif Rangka Atap',
                scene: {
                    xaxis: { title: 'X', range: [-maxVal, maxVal] },
                    yaxis: { title: 'Y', range: [-maxVal, maxVal] },
                    zaxis: { title: 'Z', range: [-maxVal, maxVal] },
                    aspectmode: 'cube'
                },
                showlegend: false,
                margin: { l: 0, r: 0, b: 0, t: 50 }
            };

            Plotly.react('plot-container', [traceU, traceV, traceOrigin], layout, config);
        }

        // Panggil fungsi sekali saat halaman pertama kali dimuat
        window.onload = updateAll;
    </script>
</body>
</html>
